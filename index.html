<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老大哥的极客导航</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #f9f9f9; --sidebar-color: #2c3e50; --card-bg: #ffffff; --text-color: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); display: flex; }
        
        /* 左侧侧边栏 */
        .sidebar { width: 220px; height: 100vh; background: var(--sidebar-color); position: fixed; color: #fff; padding-top: 20px; }
        .sidebar h2 { text-align: center; font-size: 18px; margin-bottom: 30px; color: #1abc9c; }
        .sidebar a { display: block; padding: 12px 25px; color: #ecf0f1; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .sidebar a:hover { background: #34495e; color: #1abc9c; border-left: 4px solid #1abc9c; }

        /* 右侧主内容区 */
        .main-content { margin-left: 220px; flex: 1; padding: 30px; }
        .category-title { font-size: 18px; color: var(--text-color); margin: 20px 0 15px 0; padding-left: 10px; border-left: 4px solid #1abc9c; }
        
        /* 卡片网格布局 */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 6px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: flex; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 32px; height: 32px; border-radius: 50%; margin-right: 12px; background: #eee; }
        .card-info h3 { font-size: 14px; margin-bottom: 4px; color: #2c3e50; }
        .card-info p { font-size: 12px; color: #7f8c8d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>爱的导航</h2>
        <a href="#common"><i class="fa fa-star"></i> 常用推荐</a>
        <a href="#geek"><i class="fa fa-code"></i> 极客工具</a>
    </div>

    <div class="main-content">
        
        <div id="common" class="category-title">常用推荐</div>
        <div class="card-grid">
            
            <a href="https://github.com" target="_blank" class="card">
                <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub">
                <div class="card-info">
                    <h3>GitHub</h3>
                    <p>开源代码托管平台</p>
                </div>
            </a>
            <a href="https://dash.cloudflare.com" target="_blank" class="card">
                <img src="https://www.cloudflare.com/favicon.ico" alt="Cloudflare">
                <div class="card-info">
                    <h3>Cloudflare</h3>
                    <p>DNS与域名解析管理</p>
                </div>
            </a>

        </div>

        <div id="geek" class="category-title">极客工具</div>
        <div class="card-grid">
            
            <a href="https://v2rayn.org" target="_blank" class="card">
                <img src="https://v2rayn.org/favicon.ico" alt="v2rayN">
                <div class="card-info">
                    <h3>v2rayN</h3>
                    <p>网络代理客户端工具</p>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
